services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INFRAARCH_OWNER_PASSWORD: ${INFRAARCH_OWNER_PASSWORD:?Set INFRAARCH_OWNER_PASSWORD in .env}
      INFRAARCH_APP_PASSWORD: ${INFRAARCH_APP_PASSWORD:?Set INFRAARCH_APP_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-roles-and-databases.sh:/docker-entrypoint-initdb.d/01-roles-and-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
