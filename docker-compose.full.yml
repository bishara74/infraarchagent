name: infraarch-packaged
x-settings: &settings
  DATABASE_URL: postgresql+asyncpg://infraarch_app:${INFRAARCH_APP_PASSWORD:?Export app password}@postgres:5432/infraarch
  MIGRATION_DATABASE_URL: postgresql+asyncpg://unused@127.0.0.1/unused
  TEST_DATABASE_URL: postgresql+asyncpg://unused@127.0.0.1/unused
  TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://unused@127.0.0.1/unused
  API_KEY: ${API_KEY:?Export local API key}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Export persistent master key}
  CREDENTIAL_ENCRYPTION_KEY_VERSION: "1"
  LLM_PROVIDER: stub
  PIPELINE_DEMO_SCENARIO: clean
services:
  postgres:
    image: postgres:16.4-bookworm
    user: postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export database administrator password}
      INFRAARCH_OWNER_PASSWORD: ${INFRAARCH_OWNER_PASSWORD:?Export owner password}
      INFRAARCH_APP_PASSWORD: ${INFRAARCH_APP_PASSWORD:?Export app password}
    volumes:
      - packaged_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init/01-roles-and-databases.sh:/docker-entrypoint-initdb.d/01-roles-and-databases.sh:ro
      - ./docker/postgres/init/02-inspection-role.sh:/docker-entrypoint-initdb.d/02-inspection-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    image: infraarchagent-backend:1.0-candidate
    profiles: [ops]
    environment:
      <<: *settings
      MIGRATION_DATABASE_URL: postgresql+asyncpg://infraarch_owner:${INFRAARCH_OWNER_PASSWORD:?Export owner password}@postgres:5432/infraarch
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    image: infraarchagent-backend:1.0-candidate
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *settings
    volumes:
      - ./.cache/terraform-providers:/srv/infraarch/.cache/terraform-providers:ro
      - ./.cache/terraform-provider-schemas:/srv/infraarch/.cache/terraform-provider-schemas:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    image: infraarchagent-frontend:1.0-candidate
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  packaged_postgres:
