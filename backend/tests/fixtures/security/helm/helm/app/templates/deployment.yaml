apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable
spec:
  selector:
    matchLabels:
      app: vulnerable
  template:
    metadata:
      labels:
        app: vulnerable
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          securityContext:
            privileged: true
            runAsUser: 0
