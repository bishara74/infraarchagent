[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infraarchagent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.2",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "anthropic>=1,<2",
  "openai>=3,<4",
  "httpx2",
  "PyYAML==6.0.3",
  "python-hcl2==8.1.4",
  "lark==1.3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["req(*ids): thesis requirement identifiers", "scanners: requires local scanners/validators and optional provider mirror (some tests require network namespaces)", "perf: wall-clock performance assertions; excluded by make test"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
packages = ["app"]

[tool.setuptools.package-data]
"app.security" = ["profiles/*.json"]
